# Coordinated faster response; same joint ranges, PD gains, jump rejection,
# walking caps and emergency controls as the standard profile.
r1_live_writer:
  ros__parameters:
    max_head_yaw_delta_rate_rad_s: 0.55
    max_head_pitch_delta_rate_rad_s: 0.40
    max_arm_joint_rate_rad_s: 0.75
r1_head_dry_run:
  ros__parameters:
    smoothing_alpha: 0.35
r1_kinematics_control:
  ros__parameters:
    max_joint_velocity_rad_s: 0.75
    body_proxy.max_target_speed_mps: 0.35
    position_ema_tau_sec: 0.05
    orientation_ema_tau_sec: 0.075
    trajectory_time_sec: 0.06
