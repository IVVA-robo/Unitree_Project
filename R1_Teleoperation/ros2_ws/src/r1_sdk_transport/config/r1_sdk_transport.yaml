r1_sdk_transport:
  ros__parameters:
    # Fail-safe defaults.  sdk_enabled can be set true only for the
    # read-only LowState subscriber on the isolated robot Ethernet link.
    sdk_enabled: false
    dry_run: true
    hardware_enabled: false
    commissioning_interlock: false
    arm_writer_enabled: false
    locomotion_writer_enabled: false

    network_interface: "enxb4b024be59fe"
    lowstate_channel: "rt/lf/lowstate"
    state_timeout_sec: 0.5
    publish_rate_hz: 20.0

    active_topic: "/vr/teleop/active"
    arm_input_topic: "/r1_kinematics_control/debug/arm_trajectory"
    joint_state_topic: "/r1/sdk/joint_states"
    # Re-published continuously and true only for a fresh finite LowState in
    # which motorstate is zero for every configured physical R1 slot.
    motor_health_topic: "/r1/sdk_transport/motors_healthy"
    status_topic: "/r1/sdk_transport/status"
    debug_arm_topic: "/r1/sdk_transport/debug/arm_trajectory"

    active_timeout_sec: 1.5
    command_timeout_sec: 0.25
    max_joint_step_rad: 0.15
    max_joint_velocity_rad_s: 1.0

    # The physical R1 LowState contains 35 IDL slots, of which these 26 are
    # actual joints.  The simulation URDF currently has 24 body/arm joints;
    # head_pitch/head_yaw remain physical-only until a reviewed URDF map exists.
    physical_joint_names:
      - "left_hip_pitch_joint"
      - "left_hip_roll_joint"
      - "left_hip_yaw_joint"
      - "left_knee_joint"
      - "left_ankle_pitch_joint"
      - "left_ankle_roll_joint"
      - "right_hip_pitch_joint"
      - "right_hip_roll_joint"
      - "right_hip_yaw_joint"
      - "right_knee_joint"
      - "right_ankle_pitch_joint"
      - "right_ankle_roll_joint"
      - "waist_roll_joint"
      - "waist_yaw_joint"
      - "left_shoulder_pitch_joint"
      - "left_shoulder_roll_joint"
      - "left_shoulder_yaw_joint"
      - "left_elbow_joint"
      - "left_wrist_roll_joint"
      - "right_shoulder_pitch_joint"
      - "right_shoulder_roll_joint"
      - "right_shoulder_yaw_joint"
      - "right_elbow_joint"
      - "right_wrist_roll_joint"
      - "head_pitch_joint"
      - "head_yaw_joint"

    # Command order maps one-to-one to the verified R1 ArmSdk slots
    # 15..19 (left) and 22..26 (right).  These values mirror the current R1
    # simulation URDF.  Revalidate them against the commissioned hardware
    # before any future writer is reviewed.
    arm_joint_names:
      - "left_shoulder_pitch_joint"
      - "left_shoulder_roll_joint"
      - "left_shoulder_yaw_joint"
      - "left_elbow_joint"
      - "left_wrist_roll_joint"
      - "right_shoulder_pitch_joint"
      - "right_shoulder_roll_joint"
      - "right_shoulder_yaw_joint"
      - "right_elbow_joint"
      - "right_wrist_roll_joint"
    arm_joint_min_rad: [-3.14, -0.22, -1.91, -0.97, -1.91,
                        -3.14, -2.47, -1.91, -0.97, -1.91]
    arm_joint_max_rad: [2.09, 2.47, 1.91, 2.18, 1.91,
                        2.09, 0.22, 1.91, 2.18, 1.91]
